<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#3B82F6" opacity="0.1" stroke="#3B82F6" stroke-width="2"/>
  
  <!-- Main gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- P Letter -->
  <g fill="url(#logoGradient)">
    <!-- P vertical stroke -->
    <rect x="50" y="50" width="16" height="100" rx="3"/>
    
    <!-- P curved part top -->
    <path d="M 66 50 Q 95 50 95 72.5 Q 95 95 66 95 L 66 50" fill="none" stroke="url(#logoGradient)" stroke-width="16" stroke-linecap="round"/>
  </g>
  
  <!-- Accent elements -->
  <g fill="#3B82F6" opacity="0.7">
    <!-- Decorative circle - top right -->
    <circle cx="140" cy="60" r="8"/>
    <!-- Decorative line - bottom -->
    <rect x="50" y="155" width="100" height="3" rx="1.5" fill="#3B82F6"/>
    <!-- Small accent dots -->
    <circle cx="130" cy="155" r="3" fill="#1E40AF"/>
    <circle cx="150" cy="155" r="3" fill="#1E40AF"/>
  </g>
</svg>